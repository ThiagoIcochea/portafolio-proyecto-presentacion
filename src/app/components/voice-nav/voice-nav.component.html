<div
  class="voice-nav"
  [style.right.px]="posX"
  [style.bottom.px]="posY"
>
  <div class="voice-nav__feedback" *ngIf="feedback">{{ feedback }}</div>

  <button
    #micButton
    type="button"
    class="voice-nav__btn"
    [class.is-listening]="isListening"
    [class.is-unsupported]="!isSupported"
    (pointerdown)="onPointerDown($event)"
    (click)="onButtonClick()"
    [attr.aria-label]="isListening ? 'Detener navegación por voz' : 'Activar navegación por voz'"
    title="Arrastra para mover · haz clic para hablar"
  >
    <span class="voice-nav__ring" *ngIf="isListening"></span>
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M19 11a7 7 0 0 1-14 0M12 18v3"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>
</div>
